<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline — SeenTube</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fff; color: #222; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 440px); text-align: center; }
      .icon { display: grid; place-items: center; width: 76px; height: 76px; margin: 0 auto 24px; border-radius: 22px; background: #ff385c; color: #fff; }
      h1 { margin: 0; font-size: clamp(28px, 8vw, 40px); letter-spacing: -.04em; }
      p { margin: 12px auto 24px; color: #6a6a6a; line-height: 1.6; }
      button { min-height: 44px; border: 0; border-radius: 8px; padding: 0 22px; background: #ff385c; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:active { background: #e00b41; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="38" height="38" viewBox="0 0 48 48" fill="none"><rect x="5" y="10" width="38" height="28" rx="8" fill="white" fill-opacity=".22"/><path d="M20 17.5 33 24 20 30.5v-13Z" fill="white"/></svg>
      </div>
      <h1>You’re offline</h1>
      <p>SeenTube needs an internet connection to securely load your videos, progress, and roadmaps.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
